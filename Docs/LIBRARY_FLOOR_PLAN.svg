<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%" style="background-color: #121824; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <radialGradient id="chandelierGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffecb3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffecb3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="carpetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Title & SDG Badges -->
  <text x="400" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">VR VIRTUAL LIBRARY FOR INTERACTIVE LEARNING</text>
  <text x="400" y="70" text-anchor="middle" fill="#94a3b8" font-size="14">3D Spatial Layout & Architectural Blueprint (16m × 24m)</text>
  <rect x="230" y="85" width="160" height="24" rx="12" fill="#0284c7"/>
  <text x="310" y="101" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">PRIMARY: SDG 4 Quality Education</text>
  <rect x="410" y="85" width="160" height="24" rx="12" fill="#d97706"/>
  <text x="490" y="101" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">SECONDARY: SDG 10 Reduced Ineq.</text>

  <!-- Outer Walls (16m wide x 24m deep) -->
  <rect x="100" y="130" width="600" height="800" rx="8" fill="#1e2433" stroke="#475569" stroke-width="6"/>
  <!-- Parquet Floor Interior -->
  <rect x="110" y="140" width="580" height="780" rx="4" fill="#2d221c" stroke="#543d2b" stroke-width="2"/>

  <!-- Central Carpet Runner (Navy) -->
  <rect x="330" y="160" width="140" height="740" fill="url(#carpetGrad)" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4"/>
  <text x="400" y="520" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="bold" letter-spacing="4" transform="rotate(-90 400 520)">CENTRAL RUNNER AISLE (4.0m)</text>

  <!-- High Transom Windows (North Wall) -->
  <rect x="180" y="130" width="100" height="8" fill="#93c5fd"/>
  <rect x="350" y="130" width="100" height="8" fill="#93c5fd"/>
  <rect x="520" y="130" width="100" height="8" fill="#93c5fd"/>
  <text x="400" y="123" text-anchor="middle" fill="#93c5fd" font-size="11">North High Windows (Soft Sunlight Injection)</text>

  <!-- Classical Architectural Columns -->
  <circle cx="260" cy="300" r="16" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
  <circle cx="540" cy="300" r="16" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
  <circle cx="260" cy="650" r="16" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
  <circle cx="540" cy="650" r="16" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>

  <!-- Bookshelf 1 (Computing & Programming) -->
  <rect x="150" y="240" width="70" height="180" rx="4" fill="#3e2723" stroke="#8d6e63" stroke-width="2"/>
  <text x="185" y="325" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold" transform="rotate(-90 185 325)">BOOKSHELF 1: PROGRAMMING</text>
  <!-- Bookshelf 1 Books -->
  <rect x="160" y="260" width="18" height="28" fill="#1e40af" stroke="#93c5fd"/>
  <text x="169" y="278" text-anchor="middle" fill="#fff" font-size="8">P1</text>
  <rect x="160" y="315" width="18" height="28" fill="#0e7490" stroke="#67e8f9"/>
  <text x="169" y="333" text-anchor="middle" fill="#fff" font-size="8">P2</text>
  <rect x="160" y="370" width="18" height="28" fill="#c2410c" stroke="#fdba74"/>
  <text x="169" y="388" text-anchor="middle" fill="#fff" font-size="8">P3</text>

  <!-- Bookshelf 2 (Natural Sciences) -->
  <rect x="150" y="470" width="70" height="180" rx="4" fill="#3e2723" stroke="#8d6e63" stroke-width="2"/>
  <text x="185" y="555" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold" transform="rotate(-90 185 555)">BOOKSHELF 2: SCIENCES</text>
  <!-- Bookshelf 2 Books -->
  <rect x="160" y="490" width="18" height="28" fill="#1e1b4b" stroke="#a5b4fc"/>
  <text x="169" y="508" text-anchor="middle" fill="#fff" font-size="8">S1</text>
  <rect x="160" y="545" width="18" height="28" fill="#581c87" stroke="#d8b4fe"/>
  <text x="169" y="563" text-anchor="middle" fill="#fff" font-size="8">S2</text>
  <rect x="160" y="600" width="18" height="28" fill="#14532d" stroke="#86efac"/>
  <text x="169" y="618" text-anchor="middle" fill="#fff" font-size="8">S3</text>

  <!-- Bookshelf 3 (Mathematics) -->
  <rect x="580" y="240" width="70" height="180" rx="4" fill="#3e2723" stroke="#8d6e63" stroke-width="2"/>
  <text x="615" y="325" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold" transform="rotate(90 615 325)">BOOKSHELF 3: MATHEMATICS</text>
  <!-- Bookshelf 3 Books -->
  <rect x="622" y="260" width="18" height="28" fill="#991b1b" stroke="#fca5a5"/>
  <text x="631" y="278" text-anchor="middle" fill="#fff" font-size="8">M1</text>
  <rect x="622" y="315" width="18" height="28" fill="#b45309" stroke="#fde68a"/>
  <text x="631" y="333" text-anchor="middle" fill="#fff" font-size="8">M2</text>
  <rect x="622" y="370" width="18" height="28" fill="#0f766e" stroke="#5eead4"/>
  <text x="631" y="388" text-anchor="middle" fill="#fff" font-size="8">M3</text>

  <!-- Bookshelf 4 (Literature & Civics) -->
  <rect x="580" y="470" width="70" height="180" rx="4" fill="#3e2723" stroke="#8d6e63" stroke-width="2"/>
  <text x="615" y="555" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold" transform="rotate(90 615 555)">BOOKSHELF 4: LITERATURE</text>
  <!-- Bookshelf 4 Books -->
  <rect x="622" y="490" width="18" height="28" fill="#9a3412" stroke="#fdba74"/>
  <text x="631" y="508" text-anchor="middle" fill="#fff" font-size="8">F1</text>
  <rect x="622" y="545" width="18" height="28" fill="#334155" stroke="#94a3b8"/>
  <text x="631" y="563" text-anchor="middle" fill="#fff" font-size="8">F2</text>
  <rect x="622" y="600" width="18" height="28" fill="#c2410c" stroke="#fed7aa"/>
  <text x="631" y="618" text-anchor="middle" fill="#fff" font-size="8">F3</text>

  <!-- Center Study Table & Chairs -->
  <rect x="340" y="360" width="120" height="160" rx="4" fill="#5c4033" stroke="#a07855" stroke-width="2"/>
  <text x="400" y="440" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">STUDY TABLE</text>
  <circle cx="400" cy="400" r="10" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/> <!-- Study Lamp -->
  <text x="400" y="418" text-anchor="middle" fill="#fef08a" font-size="9">Lamp</text>

  <!-- Chairs around Study Table -->
  <rect x="295" y="380" width="35" height="35" rx="3" fill="#475569"/>
  <rect x="295" y="450" width="35" height="35" rx="3" fill="#475569"/>
  <rect x="470" y="380" width="35" height="35" rx="3" fill="#475569"/>
  <rect x="470" y="450" width="35" height="35" rx="3" fill="#475569"/>

  <!-- Reception Desk & Kiosk Area -->
  <rect x="310" y="740" width="180" height="50" rx="4" fill="#451a03" stroke="#92400e" stroke-width="2"/>
  <text x="400" y="762" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">RECEPTION & KIOSK</text>
  <!-- Catalog Terminal Screen -->
  <rect x="385" y="730" width="30" height="20" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="722" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="bold">[Tab] Terminal</text>
  <!-- GK Display Books -->
  <rect x="330" y="750" width="15" height="20" fill="#a16207"/>
  <rect x="455" y="750" width="15" height="20" fill="#0369a1"/>

  <!-- Entrance Door & Spawn Point -->
  <line x1="360" y1="930" x2="440" y2="930" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <text x="400" y="955" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="bold">LIBRARY ENTRANCE / SPAWN</text>

  <!-- Player Spawn Indicator -->
  <circle cx="400" cy="860" r="14" fill="#22c55e" stroke="#ffffff" stroke-width="3"/>
  <polygon points="400,840 407,855 393,855" fill="#ffffff"/>
  <text x="400" y="890" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="bold">Player Spawn (Facing North)</text>

  <!-- Chandelier Lighting Glows -->
  <circle cx="400" cy="270" r="90" fill="url(#chandelierGlow)"/>
  <circle cx="400" cy="440" r="90" fill="url(#chandelierGlow)"/>
  <circle cx="400" cy="740" r="90" fill="url(#chandelierGlow)"/>

  <!-- Legend -->
  <rect x="110" y="945" width="580" height="40" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="125" y="970" fill="#94a3b8" font-size="11"><b>LEGEND:</b>  ■ P: Programming (3)  ■ S: Sciences (3)  ■ M: Mathematics (3)  ■ F: Literature (3)  ■ GK: General Knowledge (3)</text>
</svg>

